<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#grid)"/>

  <!-- Decorative Circuit / DDS Topology Network -->
  <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2" fill="none">
    <circle cx="200" cy="300" r="140"/>
    <circle cx="200" cy="300" r="8"/>
    <circle cx="1000" cy="380" r="180"/>
    <circle cx="1000" cy="380" r="10"/>
    <line x1="200" y1="300" x2="600" y2="240"/>
    <line x1="600" y1="240" x2="1000" y2="380"/>
    <circle cx="600" cy="240" r="6" fill="#38bdf8" fill-opacity="0.5"/>
    <path d="M 100 800 Q 300 700 600 850 T 1100 780" stroke-dasharray="8 6"/>
    <circle cx="600" cy="850" r="10" fill="#818cf8" fill-opacity="0.4"/>
    <circle cx="1100" cy="780" r="8" fill="#38bdf8" fill-opacity="0.4"/>
  </g>

  <!-- Glowing Accent Header Bar -->
  <rect x="120" y="160" width="960" height="6" rx="3" fill="url(#accentGlow)"/>

  <!-- Category & Domain Tag -->
  <text x="120" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" letter-spacing="4">INDUSTRIAL ROBOTICS &amp; LINUX SYSTEMS</text>

  <!-- Main Chinese Title -->
  <text x="120" y="360" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="76" font-weight="900" fill="#f8fafc" letter-spacing="1">Linux 工程师的</text>
  <text x="120" y="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="88" font-weight="900" fill="#38bdf8" letter-spacing="2">ROS 2 工业级实战</text>

  <!-- English Subtitle -->
  <text x="125" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#94a3b8" letter-spacing="2">The ROS 2 Linux Handbook</text>

  <!-- Subtitle Tagline Box -->
  <rect x="120" y="630" width="960" height="150" rx="12" fill="url(#badgeBg)" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="695" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="28" font-weight="500" fill="#e2e8f0">
    从 Linux 视角解构 DDS 组播、零拷贝 IPC 与 PREEMPT_RT 实时内核
  </text>
  <text x="160" y="745" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="26" font-weight="400" fill="#94a3b8">
    覆盖 Nav2 导航、BehaviorTree、音视频图传与 WebRTC 工业遥控全栈
  </text>

  <!-- Key Architecture Feature Badges (2x2 Grid) -->
  <g transform="translate(120, 840)">
    <!-- Badge 1: Linux Kernel & RT -->
    <rect x="0" y="0" width="460" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="50" cy="55" r="22" fill="#0284c7" fill-opacity="0.2"/>
    <text x="50" y="62" font-family="sans-serif" font-size="20" fill="#38bdf8" text-anchor="middle">RT</text>
    <text x="95" y="48" font-family="sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">PREEMPT_RT &amp; 实时内核</text>
    <text x="95" y="80" font-family="sans-serif" font-size="17" fill="#94a3b8">消除缺页异常与微秒级抖动</text>

    <!-- Badge 2: DDS & IPC -->
    <rect x="500" y="0" width="460" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="550" cy="55" r="22" fill="#6366f1" fill-opacity="0.2"/>
    <text x="550" y="62" font-family="sans-serif" font-size="18" fill="#818cf8" text-anchor="middle">DDS</text>
    <text x="595" y="48" font-family="sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">DDS 网络栈与零拷贝 IPC</text>
    <text x="595" y="80" font-family="sans-serif" font-size="17" fill="#94a3b8">Iceoryx 共享内存与内核网络优化</text>

    <!-- Badge 3: Teleop & WebRTC -->
    <rect x="0" y="140" width="460" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="50" cy="195" r="22" fill="#10b981" fill-opacity="0.2"/>
    <text x="50" y="202" font-family="sans-serif" font-size="17" fill="#34d399" text-anchor="middle">RTC</text>
    <text x="95" y="188" font-family="sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">GStreamer &amp; LiveKit SFU</text>
    <text x="95" y="220" font-family="sans-serif" font-size="17" fill="#94a3b8">毫秒级遥控图传与远程驾驶舱</text>

    <!-- Badge 4: Production Engineering -->
    <rect x="500" y="140" width="460" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="550" cy="195" r="22" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="550" y="202" font-family="sans-serif" font-size="17" fill="#fbbf24" text-anchor="middle">OPS</text>
    <text x="595" y="188" font-family="sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">Docker &amp; Systemd 守护</text>
    <text x="595" y="220" font-family="sans-serif" font-size="17" fill="#94a3b8">Prometheus 监控与健康体检</text>
  </g>

  <!-- Tech Stack Footnote Tags -->
  <g transform="translate(120, 1260)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#1e293b"/>
    <text x="80" y="27" font-family="sans-serif" font-size="18" font-weight="600" fill="#38bdf8" text-anchor="middle">ROS 2 Humble</text>

    <rect x="180" y="0" width="150" height="42" rx="21" fill="#1e293b"/>
    <text x="255" y="27" font-family="sans-serif" font-size="18" font-weight="600" fill="#38bdf8" text-anchor="middle">ROS 2 Jazzy</text>

    <rect x="350" y="0" width="130" height="42" rx="21" fill="#1e293b"/>
    <text x="415" y="27" font-family="sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">C++20</text>

    <rect x="500" y="0" width="140" height="42" rx="21" fill="#1e293b"/>
    <text x="570" y="27" font-family="sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">Python 3</text>

    <rect x="660" y="0" width="170" height="42" rx="21" fill="#1e293b"/>
    <text x="745" y="27" font-family="sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">Linux Kernel</text>

    <rect x="850" y="0" width="110" height="42" rx="21" fill="#1e293b"/>
    <text x="905" y="27" font-family="sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">Nav2</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="120" y1="1380" x2="1080" y2="1380" stroke="#334155" stroke-width="1.5"/>

  <!-- Author & License Footer -->
  <text x="120" y="1450" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Gemini 3.8 flash</text>
  <text x="120" y="1490" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#64748b">Open Source Handbook • Apache-2.0 License</text>

  <!-- Year / Release Stamp -->
  <text x="1080" y="1450" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="end">2026 EDITION</text>
  <text x="1080" y="1490" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#64748b" text-anchor="end">Production Ready</text>
</svg>
