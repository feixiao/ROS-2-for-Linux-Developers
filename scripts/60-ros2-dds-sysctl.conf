# ==============================================================================
# Linux Kernel Network & IPC Tuning for ROS 2 DDS High-Throughput Robotics
# Recommended deployment target: /etc/sysctl.d/60-ros2-dds.conf
# Apply with: sudo sysctl --system
# ==============================================================================

# 1. 扩大系统级套接字接收与发送缓冲区最大值 (针对高频激光雷达与 4K 工业相机数据流)
# 默认 Linux 通常仅为 212KB，在高丢包或突发突发流量时极易丢包
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432

# 2. 扩大默认套接字缓冲区大小至 8MB
net.core.rmem_default = 8388608
net.core.wmem_default = 8388608

# 3. 提升网络设备接收队列长度 (Backlog)
# 当高频点云到达网卡时，防止网卡驱动因 CPU 调度不及时直接在队列入口丢包
net.core.netdev_max_backlog = 10000

# 4. 优化 UDP 最小内存分配
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# 5. 扩展本地临时端口范围以支撑大规模多节点 DDS 端口分配
net.ipv4.ip_local_port_range = 1024 65535

# 6. 提升系统最大文件描述符句柄数 (每个 DDS 节点占用大量 socket 和 epoll 句柄)
fs.file-max = 2097152

# 7. 提升 POSIX 消息队列与共享内存段配置
fs.mqueue.msg_max = 100
fs.mqueue.msgsize_max = 65536
